<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbería El Elegante — Reserva tu cita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #b8943f;
    --gold-light: #d4ac5a;
    --gold-pale: #f0d98a;
    --gold-dim: rgba(184,148,63,0.12);
    --gold-dim2: rgba(184,148,63,0.06);
    --bg: #080807;
    --bg2: #0f0f0e;
    --bg3: #161614;
    --bg4: #1c1c19;
    --bg5: #222220;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(184,148,63,0.35);
    --border-gold: rgba(184,148,63,0.4);
    --text: #ede8dc;
    --text-muted: #6b6456;
    --text-mid: #9c9080;
    --success: #4d9e6a;
    --error: #c95252;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(184,148,63,0.06) 0%, transparent 60%);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 60px;
  }

  .page-wrap {
    width: 100%;
    max-width: 680px;
  }

  /* ── HEADER ── */
  .site-header {
    text-align: center;
    margin-bottom: 48px;
    padding-top: 8px;
  }

  .logo-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border: 1px solid var(--border-gold);
    border-radius: 50%;
    margin-bottom: 20px;
  }

  .logo-mark svg {
    width: 24px;
    height: 24px;
    fill: var(--gold);
  }

  .site-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  .site-header h1 em {
    font-style: italic;
    color: var(--gold-light);
  }

  .site-header p {
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 16px auto;
  }

  /* ── CARD ── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent 5%, rgba(184,148,63,0.3) 50%, transparent 95%);
  }

  .card-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 20px;
  }

  .card-label-num {
    width: 22px;
    height: 22px;
    border: 1px solid var(--border-gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--gold-light);
    flex-shrink: 0;
  }

  /* ── INPUTS ── */
  .fields-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 500px) {
    .fields-row { grid-template-columns: 1fr; }
  }

  .field-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-wrap label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-mid);
    letter-spacing: 0.3px;
  }

  .input-text {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 15px;
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 400;
    transition: border-color 0.25s, background 0.25s;
  }

  .input-text::placeholder { color: var(--text-muted); font-weight: 300; }
  .input-text:focus { outline: none; border-color: var(--gold); background: var(--bg4); }
  input[type="date"].input-text { color-scheme: dark; }

  /* ── SERVICIOS ── */
  .servicios-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .servicio-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .servicio-card:hover { border-color: var(--border-hover); background: var(--bg4); }

  .servicio-card.selected {
    background: var(--gold-dim);
    border-color: var(--gold);
  }

  .servicio-card.selected::after {
    content: '✓';
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    background: var(--gold);
    color: #080807;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    line-height: 22px;
    text-align: center;
  }

  .serv-name {
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 3px;
  }

  .serv-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  .serv-price {
    font-size: 16px;
    font-weight: 600;
    color: var(--gold-light);
    margin-right: 36px;
    flex-shrink: 0;
  }

  .servicio-card.selected .serv-price { margin-right: 44px; }

  /* ── BARBEROS ── */
  .barberos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
  }

  .barbero-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 12px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }

  .barbero-btn:hover { border-color: var(--border-hover); background: var(--bg4); }
  .barbero-btn.selected { background: var(--gold-dim); border-color: var(--gold); }

  .barbero-avatar {
    width: 48px;
    height: 48px;
    background: var(--bg5);
    border: 1px solid var(--border-gold);
    border-radius: 50%;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    color: var(--gold-light);
    font-size: 15px;
    letter-spacing: 0.5px;
  }

  .barbero-btn.selected .barbero-avatar {
    background: rgba(184,148,63,0.2);
    border-color: var(--gold);
    color: var(--gold-pale);
  }

  .barbero-name {
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 4px;
  }

  .barbero-esp {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 300;
  }

  /* ── HORARIOS ── */
  .horarios-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  @media (max-width: 400px) {
    .horarios-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .hora-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 4px;
    text-align: center;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    color: var(--text-mid);
    transition: all 0.18s;
    font-family: 'Outfit', sans-serif;
  }

  .hora-btn:hover:not(.ocupado) {
    border-color: var(--border-hover);
    color: #fff;
    background: var(--bg4);
  }

  .hora-btn.selected {
    background: var(--gold) !important;
    border-color: var(--gold) !important;
    color: #080807 !important;
    font-weight: 600;
  }

  .hora-btn.ocupado {
    background: transparent;
    border-color: transparent;
    color: rgba(255,255,255,0.12);
    cursor: not-allowed;
    text-decoration: line-through;
  }

  /* ── RESUMEN ── */
  .resumen-wrap {
    display: none;
    margin-top: 16px;
  }

  .resumen-wrap.visible {
    display: block;
  }

  .resumen-card {
    background: var(--bg2);
    border: 1px solid var(--border-gold);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
  }

  .resumen-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent 5%, var(--gold) 50%, transparent 95%);
  }

  .resumen-header {
    padding: 24px 28px 20px;
    border-bottom: 1px solid rgba(184,148,63,0.12);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .resumen-icon {
    width: 40px;
    height: 40px;
    background: var(--gold-dim);
    border: 1px solid var(--border-gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .resumen-icon svg {
    width: 18px;
    height: 18px;
    fill: var(--gold-light);
  }

  .resumen-header-text h3 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 2px;
  }

  .resumen-header-text p {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 300;
  }

  .resumen-body {
    padding: 24px 28px;
  }

  .resumen-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px 24px;
    margin-bottom: 24px;
  }

  @media (max-width: 480px) {
    .resumen-grid { grid-template-columns: 1fr; gap: 16px; }
  }

  

  .resumen-item .r-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .resumen-item .r-label svg {
    width: 14px;
    height: 14px;
    fill: var(--gold);
    flex-shrink: 0;
  }

  .resumen-item .r-value {
    font-size: 15px;
    font-weight: 500;
    color: #fff;
  }

  .resumen-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--gold-dim2);
    border: 1px solid rgba(184,148,63,0.15);
    border-radius: 12px;
    padding: 16px 20px;
  }

  .resumen-total .t-label {
    font-size: 13px;
    color: var(--text-mid);
    font-weight: 400;
  }

  .resumen-total .t-amount {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold-pale);
    letter-spacing: -0.5px;
  }

  /* ── BOTÓN CONFIRMAR ── */
  .confirm-btn {
    width: 100%;
    background: var(--gold);
    color: #080807;
    border: none;
    border-radius: 12px;
    padding: 17px 24px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    margin-top: 16px;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .confirm-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
  .confirm-btn:active { transform: translateY(0); }
  .confirm-btn:disabled {
    background: var(--bg4);
    color: var(--text-muted);
    cursor: not-allowed;
    transform: none;
  }

  .confirm-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    transition: transform 0.2s;
  }

  .confirm-btn:hover:not(:disabled) svg { transform: translateX(3px); }

  /* ── PROGRESS BAR ── */
  .progress-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 32px;
    padding: 0 4px;
  }

  .progress-step {
    flex: 1;
    height: 3px;
    background: var(--bg3);
    border-radius: 2px;
    transition: background 0.4s;
  }

  .progress-step.done { background: var(--gold); }
  .progress-step.active { background: rgba(184,148,63,0.5); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 14px 22px 14px 16px;
    border-radius: 100px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    transition: bottom 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
    z-index: 1000;
    opacity: 0;
    white-space: nowrap;
    font-size: 14px;
  }

  .toast.show { bottom: 36px; opacity: 1; }

  .toast-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .toast.success .toast-dot { background: var(--success); }
  .toast.error .toast-dot { background: var(--error); }
</style>
</head>
<body>

<div class="page-wrap">

  <!-- HEADER -->
  <header class="site-header">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.5 3C9.5 3 9 6 9 8C9 10 10.5 11 12 11C13.5 11 15 10 15 8C15 6 14.5 3 14.5 3H9.5ZM7 10L5 21H8L9 16H15L16 21H19L17 10C17 10 15.5 13 12 13C8.5 13 7 10 7 10Z"/>
      </svg>
    </div>
    <h1>Barbería <em>El Elegante</em></h1>
    <div class="divider"></div>
    <p>Reserva tu turno en minutos</p>
  </header>

  <!-- BARRA PROGRESO -->
  <div class="progress-bar" id="progressBar">
    <div class="progress-step" id="ps1"></div>
    <div class="progress-step" id="ps2"></div>
    <div class="progress-step" id="ps3"></div>
    <div class="progress-step" id="ps4"></div>
  </div>

  <!-- STEP 1: DATOS -->
  <div class="card">
    <div class="card-label">
      <span class="card-label-num">1</span>
      Tus datos
    </div>
    <div class="fields-row">
      <div class="field-wrap">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" class="input-text" placeholder="Ej: Juan Pérez" oninput="updateSummary()">
      </div>
      <div class="field-wrap">
        <label for="telefono">WhatsApp</label>
        <input type="tel" id="telefono" class="input-text" placeholder="88888888">
      </div>
    </div>
  </div>

  <!-- STEP 2: SERVICIO -->
  <div class="card">
    <div class="card-label">
      <span class="card-label-num">2</span>
      Elige un servicio
    </div>
    <div class="servicios-list" id="serviciosContainer"></div>
    <input type="hidden" id="servicioSelect">
    <input type="hidden" id="precioSelect">
  </div>

  <!-- STEP 3: BARBERO + FECHA -->
  <div class="card">
    <div class="card-label">
      <span class="card-label-num">3</span>
      Barbero y fecha
    </div>
    <div class="barberos-grid" id="barberosGrid"></div>
    <input type="hidden" id="barberoSeleccionado">

    <div style="margin-top: 20px;">
      <div class="field-wrap">
        <label for="fecha">Fecha de la cita</label>
        <input type="date" id="fecha" class="input-text" onchange="cargarHorarios()">
      </div>
    </div>
  </div>

  <!-- STEP 4: HORARIO -->
  <div class="card">
    <div class="card-label">
      <span class="card-label-num">4</span>
      Horario disponible
    </div>
    <div class="horarios-grid" id="horariosGrid">
      <div style="color: var(--text-muted); font-size: 13px; grid-column: 1/-1;">Selecciona una fecha para ver horarios.</div>
    </div>
    <input type="hidden" id="horaSeleccionada">
  </div>

  <!-- RESUMEN DE RESERVA -->
  <div class="resumen-wrap" id="resumenWrap">
    <div class="resumen-card">
      <div class="resumen-header">
        <div class="resumen-icon">
          <svg viewBox="0 0 24 24"><path d="M19 4H18V2H16V4H8V2H6V4H5C3.9 4 3 4.9 3 6V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V6C21 4.9 20.1 4 19 4ZM19 20H5V10H19V20ZM5 8V6H19V8H5ZM7 12H9V14H7V12ZM11 12H13V14H11V12ZM15 12H17V14H15V12Z"/></svg>
        </div>
        <div class="resumen-header-text">
          <h3>Resumen de tu reserva</h3>
          <p>Verifica los detalles antes de confirmar</p>
        </div>
      </div>
      <div class="resumen-body">
        <div class="resumen-grid">
          <div class="resumen-item">
            <div class="r-label">
              <svg viewBox="0 0 24 24"><path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"/></svg>
              Cliente
            </div>
            <div class="r-value" id="resCliente">—</div>
          </div>
          <div class="resumen-item">
            <div class="r-label">
              <svg viewBox="0 0 24 24"><path d="M9.5 3C9.5 3 9 6 9 8C9 10 10.5 11 12 11C13.5 11 15 10 15 8C15 6 14.5 3 14.5 3H9.5ZM7 10L5 21H8L9 16H15L16 21H19L17 10C17 10 15.5 13 12 13C8.5 13 7 10 7 10Z"/></svg>
              Barbero
            </div>
            <div class="r-value" id="resBarbero">—</div>
          </div>
          <div class="resumen-item">
            <div class="r-label">
              <svg viewBox="0 0 24 24"><path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2ZM20 16H5.17L4 17.17V4H20V16ZM7 9H9V11H7V9ZM11 9H13V11H11V9ZM15 9H17V11H15V9Z"/></svg>
              Servicio
            </div>
            <div class="r-value" id="resServicio">—</div>
          </div>
          <div class="resumen-item">
            <div class="r-label">
              <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12C2 17.52 6.47 22 11.99 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 11.99 2ZM12 20C7.58 20 4 16.42 4 12C4 7.58 7.58 4 12 4C16.42 4 20 7.58 20 12C20 16.42 16.42 20 12 20ZM12.5 7H11V13L16.25 16.15L17 14.92L12.5 12.25V7Z"/></svg>
              Fecha y hora
            </div>
            <div class="r-value" id="resFechaHora">—</div>
          </div>
        </div>

        <div class="resumen-total">
          <div class="t-label">Total a pagar</div>
          <div class="t-amount" id="resPrecio">¢0</div>
        </div>
      </div>
    </div>

    <button class="confirm-btn" id="confirmBtn" onclick="confirmarReserva()">
      Confirmar reserva
      <svg viewBox="0 0 24 24"><path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z"/></svg>
    </button>
  </div>

</div><!-- /page-wrap -->

<div class="toast" id="toast">
  <div class="toast-dot"></div>
  <span id="toastMsg"></span>
</div>

<script>
const API = "https://automatizacion-de-barberias.onrender.com/api";

document.addEventListener("DOMContentLoaded", () => {
  cargarServicios();
  cargarBarberosCliente();
  const hoy = new Date().toISOString().split('T')[0];
  const inputFecha = document.getElementById("fecha");
  inputFecha.value = hoy;
  inputFecha.min = hoy;
  cargarHorarios();
  updateProgress();
});

/* PROGRESO */
function updateProgress() {
  const steps = [
    document.getElementById("nombre").value.trim(),
    document.getElementById("servicioSelect").value,
    document.getElementById("barberoSeleccionado").value,
    document.getElementById("horaSeleccionada").value,
  ];
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById("ps" + i);
    if (steps[i-1]) el.className = "progress-step done";
    else el.className = "progress-step" + (steps.slice(0, i-1).every(Boolean) ? " active" : "");
  }
}

/* SERVICIOS */
async function cargarServicios() {
  try {
    const res = await fetch(`${API}/servicio`);
    const servicios = await res.json();
    const contenedor = document.getElementById("serviciosContainer");
    contenedor.innerHTML = servicios.map(s => `
      <div class="servicio-card" data-nombre="${s.nombre}" data-precio="${s.precio}" onclick="seleccionarServicio(this)">
        <div>
          <div class="serv-name">${s.nombre}</div>
          <div class="serv-sub">${s.duracion ? s.duracion + ' min' : 'Servicio profesional'}</div>
        </div>
        <div class="serv-price">¢${parseInt(s.precio).toLocaleString()}</div>
      </div>
    `).join("");
  } catch (e) {
    console.error("Error al cargar servicios:", e);
    document.getElementById("serviciosContainer").innerHTML = `<div style="color:var(--text-muted);font-size:13px;">No se pudieron cargar los servicios.</div>`;
  }
}

function seleccionarServicio(el) {
  document.querySelectorAll(".servicio-card").forEach(c => c.classList.remove("selected"));
  el.classList.add("selected");
  document.getElementById("servicioSelect").value = el.dataset.nombre;
  document.getElementById("precioSelect").value = el.dataset.precio;
  updateSummary();
  cargarHorarios();
}

/* BARBEROS */
async function cargarBarberosCliente() {
  const grid = document.getElementById("barberosGrid");
  try {
    const res = await fetch(`${API}/barberos`);
    if (!res.ok) throw new Error();
    const todos = await res.json();
    const activos = todos.filter(b => b.activo !== false);

    if (!activos.length) {
      grid.innerHTML = "<div style='color:var(--text-muted);font-size:13px;'>No hay barberos disponibles.</div>";
      return;
    }

    grid.innerHTML = activos.map(b => {
      const ini = b.avatarInitials || (b.nombre ? b.nombre.split(" ").map(n => n[0]).join("").toUpperCase().substring(0,2) : "B");
      return `
        <div class="barbero-btn" data-nombre="${b.nombre}">
          <div class="barbero-avatar">${ini}</div>
          <div class="barbero-name">${b.nombre}</div>
          <div class="barbero-esp">${b.especialidad || 'Barbero Profesional'}</div>
        </div>
      `;
    }).join("");

    document.querySelectorAll(".barbero-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".barbero-btn").forEach(b => b.classList.remove("selected"));
        this.classList.add("selected");
        document.getElementById("barberoSeleccionado").value = this.dataset.nombre;
        updateSummary();
        cargarHorarios();
      });
    });
  } catch (e) {
    grid.innerHTML = `<div style='color:var(--error);font-size:13px;'>Error al cargar barberos.</div>`;
  }
}

/* HORARIOS */
async function cargarHorarios() {
  const fecha = document.getElementById("fecha").value;
  if (!fecha) return;
  const grid = document.getElementById("horariosGrid");
  grid.innerHTML = `<div style="color:var(--text-muted);font-size:13px;grid-column:1/-1;">Cargando horarios…</div>`;
  try {
    const res = await fetch(`${API}/citas/horarios/${fecha}`);
    const horarios = await res.json();
    if (!horarios.length) {
      grid.innerHTML = `<div style="color:var(--text-muted);font-size:13px;grid-column:1/-1;">No hay horarios disponibles para esta fecha.</div>`;
      return;
    }
    grid.innerHTML = horarios.map(horaTexto => {
      let [hh, mm] = horaTexto.split(':');
      let ampm = hh >= 12 ? 'PM' : 'AM';
      let hh12 = hh % 12 || 12;
      let fmt = `${hh12}:${mm} ${ampm}`;
      return `<div class="hora-btn" onclick="seleccionarHora(this,'${horaTexto}')">${fmt}</div>`;
    }).join("");
  } catch (e) {
    grid.innerHTML = `<div style="color:var(--error);font-size:13px;grid-column:1/-1;">Error al obtener horarios.</div>`;
  }
}

function seleccionarHora(el, hora) {
  document.querySelectorAll(".hora-btn").forEach(b => b.classList.remove("selected"));
  el.classList.add("selected");
  document.getElementById("horaSeleccionada").value = hora;
  updateSummary();
}

/* RESUMEN */
function updateSummary() {
  const nombre = document.getElementById("nombre").value.trim();
  const servicio = document.getElementById("servicioSelect").value;
  const barbero = document.getElementById("barberoSeleccionado").value;
  const fecha = document.getElementById("fecha").value;
  const hora = document.getElementById("horaSeleccionada").value;
  const precio = document.getElementById("precioSelect").value;
  const wrap = document.getElementById("resumenWrap");

  updateProgress();

  if (nombre && servicio && barbero && fecha && hora) {
    const [y, m, d] = fecha.split('-');
    const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const fechaFmt = `${parseInt(d)} ${meses[parseInt(m)-1]}. ${y}`;
    let [hh, mm] = hora.split(':');
    let ampm = hh >= 12 ? 'PM' : 'AM';
    let hh12 = hh % 12 || 12;
    const horaFmt = `${hh12}:${mm} ${ampm}`;

    document.getElementById("resCliente").textContent = nombre;
    document.getElementById("resServicio").textContent = servicio;
    document.getElementById("resBarbero").textContent = barbero;
    document.getElementById("resFechaHora").textContent = `${fechaFmt} · ${horaFmt}`;
    document.getElementById("resPrecio").textContent = precio ? `¢${parseInt(precio).toLocaleString()}` : '—';
    wrap.classList.add("visible");
  } else {
    wrap.classList.remove("visible");
  }
}

/* CONFIRMAR */
async function confirmarReserva() {
  const btn = document.getElementById("confirmBtn");
  const datos = {
    nombre: document.getElementById("nombre").value.trim(),
    telefono: document.getElementById("telefono").value.trim(),
    servicio: document.getElementById("servicioSelect").value,
    barbero: document.getElementById("barberoSeleccionado").value,
    fecha: document.getElementById("fecha").value,
    horaInicio: document.getElementById("horaSeleccionada").value
  };

  if (!datos.nombre || !datos.servicio || !datos.barbero || !datos.horaInicio) {
    showToast("Completa todos los campos requeridos", "error");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = 'Enviando… <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor;animation:spin 1s linear infinite;"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>';

  const style = document.createElement('style');
  style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
  document.head.appendChild(style);

  try {
    const res = await fetch(`${API}/citas`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datos)
    });
    if (res.ok) {
      showToast("¡Reserva confirmada exitosamente!", "success");
      setTimeout(() => location.reload(), 2500);
    } else {
      showToast("Error al procesar la reserva", "error");
      btn.disabled = false;
      btn.innerHTML = 'Confirmar reserva <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor;"><path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z"/></svg>';
    }
  } catch(e) {
    showToast("Error de conexión con el servidor", "error");
    btn.disabled = false;
    btn.innerHTML = 'Confirmar reserva <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor;"><path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z"/></svg>';
  }
}

/* TOAST */
function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.className = "toast " + type + " show";
  setTimeout(() => t.classList.remove("show"), 3800);
}
</script>
