<!DOCTYPE html>
<html>
<head>
  <title>Barbería PRO 💈</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <style>
    body { display:flex; margin:0; font-family:Arial; }

    #calendar { width:65%; padding:20px; }

    #panel {
      width:35%;
      background:#111;
      color:white;
      height:100vh;
      overflow:auto;
      padding:20px;
    }

    .cita {
      background:#222;
      margin:10px 0;
      padding:10px;
      border-radius:8px;
    }
  </style>
</head>

<body>

<div id="calendar"></div>

<div id="panel">
  <h2>Citas</h2>
  <div id="lista"></div>
</div>

<script>

document.addEventListener("DOMContentLoaded", function() {

  const calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {

    editable: true,

    dateClick: function(info) {
      const nombre = prompt("Nombre:");
      const telefono = prompt("Teléfono:");
      const servicio = prompt("Servicio:");
      const barberoId = prompt("ID Barbero:");

      fetch("http://localhost:3000/api/citas", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          nombre, telefono, servicio,
          fecha: info.dateStr,
          barberoId
        })
      }).then(() => location.reload());
    },

    eventDrop: async function(info) {
      await fetch(`http://localhost:3000/api/citas/${info.event.id}`, {
        method:"PUT",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          fecha: info.event.startStr
        })
      });
    },

    events: async function(_, cb) {
      const res = await fetch("http://localhost:3000/api/citas");
      const data = await res.json();

      cb(data.map(c => ({
        id: c._id,
        title: c.nombre,
        date: c.fecha,
        color: "green"
      })));
    }

  });

  calendar.render();

  cargarLista();
});

// LISTA
async function cargarLista() {
  const res = await fetch("http://localhost:3000/api/citas");
  const data = await res.json();

  document.getElementById("lista").innerHTML =
    data.reverse().map(c => `
      <div class="cita">
        ${c.nombre}<br>
        ${c.servicio}<br>
        🕒 ${c.horaInicio} - ${c.horaFin}
      </div>
    `).join("");
}

</script>

</body>
</html>
